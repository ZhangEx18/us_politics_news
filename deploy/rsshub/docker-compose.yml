services:
  rsshub:
    image: diygod/rsshub:latest
    container_name: uspn-rsshub
    restart: unless-stopped
    ports:
      - "1200:1200"
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      CACHE_EXPIRE: "600"
      REQUEST_TIMEOUT: "60"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:1200/"]
      interval: 30s
      timeout: 5s
      retries: 3

